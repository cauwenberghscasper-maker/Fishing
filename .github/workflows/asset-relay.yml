name: asset-relay
# Downloads files the work sandbox can't reach (Hugging Face outputs, CC0 asset zips)
# and publishes them on branch asset-drop under drop/<batch>/.
on:
  push:
    branches: [asset-pipeline]
    paths: ['pipeline/requests.json']

permissions:
  contents: write

concurrency:
  group: asset-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -u
          BATCH=$(jq -r '.batch // empty' pipeline/requests.json)
          if [ -z "$BATCH" ]; then echo "no batch"; exit 0; fi
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"
          OUT="/tmp/drop/$BATCH"; mkdir -p "$OUT"
          LOG="$OUT/_log.txt"; : > "$LOG"
          jq -c '.files[]' pipeline/requests.json | while read -r f; do
            url=$(echo "$f" | jq -r .url); path=$(echo "$f" | jq -r .path)
            case "$path" in *..*|/*) echo "FAIL $path bad path" >> "$LOG"; continue;; esac
            mkdir -p "$(dirname "$OUT/$path")"
            if curl -fsSL --retry 2 -A "Mozilla/5.0 (asset-relay)" -o "$OUT/$path" "$url"; then
              echo "OK $path $(stat -c%s "$OUT/$path")" >> "$LOG"
            else
              echo "FAIL $path $url" >> "$LOG"; rm -f "$OUT/$path"
            fi
          done
          find "$OUT" -type f -size +95M -print -delete | sed 's/^/TOO_BIG /' >> "$LOG" || true
          cat "$LOG"
      - name: Publish to asset-drop
        if: env.BATCH != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd /tmp
          if git ls-remote --exit-code --heads "$REMOTE" asset-drop >/dev/null 2>&1; then
            git clone --depth 1 --branch asset-drop "$REMOTE" dropbranch
          else
            mkdir dropbranch && cd dropbranch && git init -b asset-drop && git remote add origin "$REMOTE" && cd ..
          fi
          mkdir -p dropbranch/drop && rm -rf "dropbranch/drop/$BATCH" && cp -r "/tmp/drop/$BATCH" dropbranch/drop/
          cd dropbranch
          git config user.name "asset-relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "drop: $BATCH" || exit 0
          for i in 1 2 3; do git push origin asset-drop && break; git pull --rebase origin asset-drop || true; sleep 3; done
