<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#06262b" />
    <title>Fishing</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #06262b; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="hud-fishing"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
